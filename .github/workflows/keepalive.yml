# Anti-sleep keepalive: pings the Render service every 10 minutes so the
# free tier's 15-minute idle timeout never fires. Runs on GitHub's clock,
# costs nothing, and works even while your computer is off.
#
# SETUP (one-time, in GitHub):
#   Repo → Settings → Secrets and variables → Actions → New repository secret
#     Name: RENDER_URL
#     Value: https://fuse-hub-xxxx.onrender.com   (your service's URL)
#
# NOTE: scheduled workflows only run on the default branch, and GitHub
# disables schedules after ~60 days of repo inactivity — any push resets
# that timer (or re-enable under Actions → Keepalive fleet awake).

name: Keepalive fleet awake

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch: {} # manual run button for testing

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping healthz
        run: |
          if [ -z "${{ secrets.RENDER_URL }}" ]; then
            echo "RENDER_URL secret not set yet — skipping ping."
            exit 0
          fi
          code=$(curl -s -o /dev/null -m 60 -w "%{http_code}" "${{ secrets.RENDER_URL }}/healthz")
          echo "GET /healthz -> $code"
          [ "$code" = "200" ]
